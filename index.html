<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b2a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VALORE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>VALORE — Calculadora Financeira</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light dark;--bg:#050807;--text:#f5f7f6;--muted:#aeb8b2;--panel:#0d1210;--panel2:#101613;--input:#171c1a;--border:#35413b;--accent:#19a957;--buttonText:#ffffff;--active:#1b241f;--result:#0d1210}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background .2s,color .2s}
main{max-width:760px;margin:auto;padding:18px 15px 35px}.brand{font-size:29px;font-weight:900;letter-spacing:.08em}.brand-logo{width:190px;height:auto;display:block;max-width:100%}.sub{color:var(--muted);font-size:15px;margin-top:2px}
.switch{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);padding:4px;border-radius:13px;margin:20px 0 14px}.switch button{border:0;background:transparent;color:var(--text);padding:12px;border-radius:10px;font-weight:900;font-size:18px;cursor:pointer}.switch .active{background:var(--active);color:#ffffff;box-shadow:0 2px 8px #0008}
.card{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:15px;margin-top:12px}.title{font-size:15px;font-weight:800;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 5px}.field input{width:100%;height:46px;border:1px solid var(--border);border-radius:11px;padding:8px 10px;font-size:16px;background:var(--input);color:var(--text)}
.top-novo{height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--accent);background:transparent;color:var(--text);font-weight:800;font-size:16px;cursor:pointer}.actions{display:flex;gap:10px;margin-top:14px}.actions button{height:48px;border-radius:11px;border:1px solid var(--border);background:var(--buttonBg,#fff);color:var(--buttonFg,#111);font-weight:800;padding:0 16px}.actions .calc{flex:1;background:var(--accent);color:#fff;border-color:var(--accent)}
.mainresult{margin-top:15px;border-radius:16px;padding:17px;text-align:center;border:2px solid var(--border);background:var(--result)}.mainresult.pos{background:#0b2417;border-color:#20c46a}.mainresult.neg{background:#2a1010;border-color:#df5b5b}.mainresult.zero{background:var(--result)}
.label{font-size:11px;font-weight:900;letter-spacing:.12em}.value{font-size:31px;font-weight:900;margin-top:5px;overflow-wrap:anywhere}
.results{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.r{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:11px}.r span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.r strong{font-size:15px}
.historyhead{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px}.historyhead h2{font-size:16px;margin:0}.historyhead button{border:0;background:none;color:var(--muted);font-weight:700}
.item{display:flex;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:11px;margin-top:7px}.item small{display:block;color:#8e9a94;margin-top:3px}.error{color:#b42318;font-size:13px;min-height:18px;margin-top:7px}
@media (prefers-color-scheme: light){
:root{--bg:#f4f6f5;--text:#17211c;--muted:#65716b;--panel:#ffffff;--panel2:#e7ece9;--input:#f8faf9;--border:#b8c4bd;--active:#d8e4dd;--buttonText:#123b2a;--result:#ffffff}
.switch .active{color:#123b2a;box-shadow:0 2px 8px #0002}.actions button{--buttonBg:#ffffff;--buttonFg:#17301f}.mainresult.pos{background:#e9f8ef}.mainresult.neg{background:#fdecec}.mainresult.zero{background:#ffffff}.item small{color:#6f7b75}.error{color:#b42318}
}

@media(max-width:430px){.brand-logo{width:165px}.grid{grid-template-columns:1fr 1fr;gap:8px}.field label{font-size:11px}.field input{height:44px;font-size:15px}.results{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><img src="logo-valore.png" class="brand-logo" alt="Valore Agro"><div class="sub">Calculadora Financeira</div></div><button id="topNovo" class="top-novo" type="button">Novo</button></div>
  <div class="switch"><button id="cif" class="active">CIF</button><button id="fob">FOB</button></div>

  <form id="form">
    <div class="card"><div class="title">Dados da operação</div><div class="grid">
      <div class="field"><label>Quantidade (kg)</label><input id="q" type="text" inputmode="decimal"></div>
      <div class="field"><label>Preço Compra</label><input id="pc" type="text" inputmode="decimal"></div>
      <div class="field"><label>Preço Venda</label><input id="pv" type="text" inputmode="decimal"></div>
      <div class="field"><label>Juros a.m. %</label><input id="jm" type="text" inputmode="decimal"></div>
      <div class="field"><label>Dias Juros</label><input id="dj" type="text" inputmode="decimal"></div>
      <div class="field"><label>Frete</label><input id="fr" type="text" inputmode="decimal"></div>
    </div></div>

    <div class="card"><div class="title">Custos e ajustes</div><div class="grid">
      <div class="field"><label>Classificação</label><input id="cl" type="text" inputmode="decimal"></div>
      <div class="field"><label>Comissão CNV</label><input id="cnv" type="text" inputmode="decimal"></div>
      <div class="field"><label>Comissão NFP</label><input id="nfp" type="text" inputmode="decimal"></div>
      <div class="field"><label>Comissão CNC</label><input id="cnc" type="text" inputmode="decimal"></div>
      <div class="field"><label>Deságio</label><input id="des" type="text" inputmode="decimal"></div>
      <div class="field"><label>Outros</label><input id="out" type="text" inputmode="decimal"></div>
      <div class="field"><label>Taxa Comissão %</label><input id="tx" type="text" value="25" inputmode="decimal"></div>
    </div></div>

    <div id="error" class="error"></div>
    <div class="actions"><button class="calc" type="submit">Calcular e salvar</button><button id="novo" type="button">Novo</button></div>
  </form>

  <section id="resultado"></section>
  <div class="historyhead"><h2>Histórico</h2><button id="clear" type="button">Limpar</button></div>
  <section id="historico"><div style="color:#8e9a94;font-size:13px">Nenhum cálculo salvo.</div></section>
</main>

<script>
const $=id=>document.getElementById(id),
parsePt=v=>{v=String(v).trim();if(!v)return 0;if(v.includes(","))v=v.replace(/\./g,"").replace(",",".");return parseFloat(v)},
n=id=>{let v=parsePt($(id).value);return Number.isFinite(v)&&v>=0?v:0};
const decimalIds=["pc","pv","jm","fr","cl","cnv","nfp","cnc","des","out","tx"];
decimalIds.forEach(id=>{const el=$(id);el.addEventListener("blur",()=>{let v=n(id);if($(id).value!=="")$(id).value=v.toFixed(2).replace(".",",")});});
const qty=$("q");
qty.addEventListener("focus",()=>{if(qty.value)qty.value=qty.value.replace(/\./g,"")});
qty.addEventListener("blur",()=>{let v=n("q");if(qty.value!=="")qty.value=new Intl.NumberFormat("pt-BR",{maximumFractionDigits:0}).format(v)});

// ENTER avança para o próximo campo, na mesma ordem visual do formulário.
// No último campo, ENTER executa o cálculo.
const formInputs=Array.from(document.querySelectorAll("#form input"));
formInputs.forEach((el,i)=>el.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  e.preventDefault();
  el.blur();
  if(i<formInputs.length-1){
    formInputs[i+1].focus();
    formInputs[i+1].select?.();
  }else{
    $("form").requestSubmit();
  }
}));
let tipo="CIF", history=JSON.parse(localStorage.getItem("valoreHistory")||"[]");
const money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v||0);
const num=v=>new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0);

function setTipo(t){tipo=t;$("cif").classList.toggle("active",t==="CIF");$("fob").classList.toggle("active",t==="FOB")}
$("cif").onclick=()=>setTipo("CIF");$("fob").onclick=()=>setTipo("FOB");

function calc(){
 const q=n("q"),pc=n("pc"),pv=n("pv"),jm=n("jm"),dj=n("dj"),fr=n("fr"),cl=n("cl"),cnv=n("cnv"),nfp=n("nfp"),cnc=n("cnc"),des=n("des"),out=n("out"),tx=n("tx")/100;
 if(q<=0)return null;
 const tj=jm/30*dj;
 const pagar=tipo==="CIF"?q*pc/60+q*fr/60:q*pc/60;
 const receber=q*pv/60,jf=pagar*tj/100,jsc=jf/q*60,margem=pv-pc-jsc;
 const rm=margem-fr-cl-cnv-nfp-cnc-des-out,com=rm*tx,ml=rm-com;
 return {q,pagar,receber,jf,jsc,margem,rm,com,ml,resultado:q*ml/60,tipo};
}
function render(x){
 const cls=x.rm>0?"pos":x.rm<0?"neg":"zero";
 const rows=[["Valor a pagar",x.pagar],["Valor a receber",x.receber],["Juros financeiro",x.jf],["Valor J./Sc",x.jsc],["Margem",x.margem],["Comissão/sc",x.com],["Margem líquida/sc",x.ml],["Resultado líquido",x.resultado]];
 $("resultado").innerHTML=`<div class="mainresult ${cls}"><div class="label">RESULTADO MARGEM</div><div class="value">${money(x.rm)}</div></div><div class="results">${rows.map(r=>`<div class="r"><span>${r[0]}</span><strong>${money(r[1])}</strong></div>`).join("")}</div>`;
}
function renderHistory(){
 $("historico").innerHTML=history.length?history.map(h=>`<div class="item"><div><b>${h.tipo} • ${num(h.q)} kg</b><small>${h.date}</small></div><b>${money(h.rm)}</b></div>`).join(""):`<div style="color:#8e9a94;font-size:13px">Nenhum cálculo salvo.</div>`;
}
$("form").onsubmit=e=>{e.preventDefault();$("error").textContent="";let x=calc();if(!x){$("error").textContent="Informe uma quantidade maior que zero.";return}render(x);history.unshift({tipo:x.tipo,q:x.q,rm:x.rm,date:new Intl.DateTimeFormat("pt-BR",{dateStyle:"short",timeStyle:"short"}).format(new Date())});history=history.slice(0,50);localStorage.setItem("valoreHistory",JSON.stringify(history));renderHistory()};
$("novo").onclick=()=>{$("form").reset();$("tx").value=25;$("resultado").innerHTML="";$("error").textContent="";setTipo("CIF")};
$("topNovo").onclick=()=>$("novo").click();
$("clear").onclick=()=>{history=[];localStorage.removeItem("valoreHistory");renderHistory()};
renderHistory();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
