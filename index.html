<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VALORE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>VALORE — Calculadora Financeira</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f5;color:#18231e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:18px 15px 35px}.brand{font-size:25px;font-weight:800;letter-spacing:.04em}.sub{color:#6a756f;font-size:13px;margin-top:2px}
.switch{display:grid;grid-template-columns:1fr 1fr;background:#e8ece9;padding:4px;border-radius:13px;margin:20px 0 14px}.switch button{border:0;background:transparent;padding:12px;border-radius:10px;font-weight:800;font-size:15px}.switch .active{background:#fff;box-shadow:0 2px 7px #0001}
.card{background:#fff;border:1px solid #dce3df;border-radius:15px;padding:15px;margin-top:12px}.title{font-size:15px;font-weight:800;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 5px}.field input{width:100%;height:46px;border:1px solid #d2dbd6;border-radius:10px;padding:8px 10px;font-size:16px;background:#fff}
.actions{display:flex;gap:10px;margin-top:14px}.actions button{height:48px;border-radius:11px;border:1px solid #cfd8d3;background:#fff;font-weight:800;padding:0 16px}.actions .calc{flex:1;background:#123b2a;color:#fff;border-color:#123b2a}
.mainresult{margin-top:15px;border-radius:16px;padding:17px;text-align:center;border:2px solid #cfd8d3;background:#fff}.mainresult.pos{background:#edf9f2;border-color:#27a36b}.mainresult.neg{background:#fff0f0;border-color:#d84b4b}.mainresult.zero{background:#f5f6f6}
.label{font-size:11px;font-weight:900;letter-spacing:.12em}.value{font-size:31px;font-weight:900;margin-top:5px;overflow-wrap:anywhere}
.results{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.r{background:#fff;border:1px solid #dce3df;border-radius:11px;padding:11px}.r span{display:block;color:#6a756f;font-size:11px;margin-bottom:4px}.r strong{font-size:15px}
.historyhead{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px}.historyhead h2{font-size:16px;margin:0}.historyhead button{border:0;background:none;color:#607067;font-weight:700}
.item{display:flex;justify-content:space-between;gap:10px;background:#fff;border:1px solid #dce3df;border-radius:11px;padding:11px;margin-top:7px}.item small{display:block;color:#718078;margin-top:3px}.error{color:#b42318;font-size:13px;min-height:18px;margin-top:7px}
@media(max-width:520px){.grid,.results{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <div class="brand">VALORE</div><div class="sub">Calculadora Financeira</div>
  <div class="switch"><button id="cif" class="active">CIF</button><button id="fob">FOB</button></div>

  <form id="form">
    <div class="card"><div class="title">Dados da operação</div><div class="grid">
      <div class="field"><label>Quantidade (kg)</label><input id="q" type="number" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label>Preço Compra</label><input id="pc" type="number" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label>Preço Venda</label><input id="pv" type="number" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label>Juros a.m. %</label><input id="jm" type="number" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label>Dias Juros</label><input id="dj" type="number" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label>Frete</label><input id="fr" type="number" min="0" step="any" inputmode="decimal"></div>
    </div></div>

    <div class="card"><div class="title">Custos e ajustes</div><div class="grid">
      <div class="field"><label>Classificação</label><input id="cl" type="number" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label>Comissão CNV</label><input id="cnv" type="number" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label>Comissão NFP</label><input id="nfp" type="number" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label>Comissão CNC</label><input id="cnc" type="number" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label>Deságio</label><input id="des" type="number" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label>Outros</label><input id="out" type="number" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label>Taxa Comissão %</label><input id="tx" type="number" min="0" step="any" value="25" inputmode="decimal"></div>
    </div></div>

    <div id="error" class="error"></div>
    <div class="actions"><button class="calc" type="submit">Calcular e salvar</button><button id="novo" type="button">Novo</button></div>
  </form>

  <section id="resultado"></section>
  <div class="historyhead"><h2>Histórico</h2><button id="clear" type="button">Limpar</button></div>
  <section id="historico"><div style="color:#718078;font-size:13px">Nenhum cálculo salvo.</div></section>
</main>

<script>
const $=id=>document.getElementById(id), n=id=>{let v=parseFloat($(id).value);return Number.isFinite(v)&&v>=0?v:0};
let tipo="CIF", history=JSON.parse(localStorage.getItem("valoreHistory")||"[]");
const money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v||0);
const num=v=>new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0);

function setTipo(t){tipo=t;$("cif").classList.toggle("active",t==="CIF");$("fob").classList.toggle("active",t==="FOB")}
$("cif").onclick=()=>setTipo("CIF");$("fob").onclick=()=>setTipo("FOB");

function calc(){
 const q=n("q"),pc=n("pc"),pv=n("pv"),jm=n("jm"),dj=n("dj"),fr=n("fr"),cl=n("cl"),cnv=n("cnv"),nfp=n("nfp"),cnc=n("cnc"),des=n("des"),out=n("out"),tx=n("tx")/100;
 if(q<=0)return null;
 const tj=jm/30*dj;
 const pagar=tipo==="CIF"?q*pc/60+q*fr/60:q*pc/60;
 const receber=q*pv/60,jf=pagar*tj/100,jsc=jf/q*60,margem=pv-pc-jsc;
 const rm=margem-fr-cl-cnv-nfp-cnc-des-out,com=rm*tx,ml=rm-com;
 return {q,pagar,receber,jf,jsc,margem,rm,com,ml,resultado:q*ml/60,tipo};
}
function render(x){
 const cls=x.rm>0?"pos":x.rm<0?"neg":"zero";
 const rows=[["Valor a pagar",x.pagar],["Valor a receber",x.receber],["Juros financeiro",x.jf],["Valor J./Sc",x.jsc],["Margem",x.margem],["Comissão/sc",x.com],["Margem líquida/sc",x.ml],["Resultado líquido",x.resultado]];
 $("resultado").innerHTML=`<div class="mainresult ${cls}"><div class="label">RESULTADO MARGEM</div><div class="value">${money(x.rm)}</div></div><div class="results">${rows.map(r=>`<div class="r"><span>${r[0]}</span><strong>${money(r[1])}</strong></div>`).join("")}</div>`;
}
function renderHistory(){
 $("historico").innerHTML=history.length?history.map(h=>`<div class="item"><div><b>${h.tipo} • ${num(h.q)} kg</b><small>${h.date}</small></div><b>${money(h.rm)}</b></div>`).join(""):`<div style="color:#718078;font-size:13px">Nenhum cálculo salvo.</div>`;
}
$("form").onsubmit=e=>{e.preventDefault();$("error").textContent="";let x=calc();if(!x){$("error").textContent="Informe uma quantidade maior que zero.";return}render(x);history.unshift({tipo:x.tipo,q:x.q,rm:x.rm,date:new Intl.DateTimeFormat("pt-BR",{dateStyle:"short",timeStyle:"short"}).format(new Date())});history=history.slice(0,50);localStorage.setItem("valoreHistory",JSON.stringify(history));renderHistory()};
$("novo").onclick=()=>{$("form").reset();$("tx").value=25;$("resultado").innerHTML="";$("error").textContent="";setTipo("CIF")};
$("clear").onclick=()=>{history=[];localStorage.removeItem("valoreHistory");renderHistory()};
renderHistory();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
